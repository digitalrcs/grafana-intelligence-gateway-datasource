apiVersion: 1

datasources:
  - name: Intelligence Gateway Review AI
    uid: intelligence-gateway-review
    type: digitalrcs-intelligencegateway-datasource
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      provider: custom
      baseUrl: http://mock-ai:8080/v1
      defaultModel: review-model
      timeoutSeconds: 300
      allowedModels:
        - review-model
      maxOutputTokens: 256000
      allowInsecureHttp: true
